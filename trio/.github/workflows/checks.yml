name: Workflow checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check script syntax
        run: |
          scripts=plugins/trio-claude-gemini-codex/skills/trio-claude-gemini-codex/scripts
          for script in "$scripts"/*.sh; do bash -n "$script"; done
          node --check "$scripts/capture_screens.mjs"
      - name: Test workflow with local stubs
        run: python3 -m unittest discover -s tests -v
